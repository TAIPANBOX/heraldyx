# The estate's secret scan (estate-gates CLAUDE.md invariant 23): this
# repository's tree holds no value that looks like a secret, except the
# fingerprints listed with a reason in .secretscan-allow. It prints masks and
# fingerprints, never a value. Free on a public repository.
name: secretscan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secretscan:
    uses: TAIPANBOX/estate-gates/.github/workflows/secretscan.yml@0c5b291a5fee8269e30671e0608376a17a2bff22 # estate-gates ci/secretscan-reusable (pre-merge test)
    with:
      scanner-ref: 0c5b291a5fee8269e30671e0608376a17a2bff22
