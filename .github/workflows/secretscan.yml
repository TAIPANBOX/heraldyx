# The estate's secret scan (estate-gates CLAUDE.md invariant 23): this
# repository's tree holds no value that looks like a secret, except the
# fingerprints listed with a reason in .secretscan-allow. It prints masks and
# fingerprints, never a value. Free on a public repository.
name: secretscan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secretscan:
    uses: TAIPANBOX/estate-gates/.github/workflows/secretscan.yml@cdc903eabbd6af35e3e001e6817e70111d35344f # estate-gates ci/secretscan-reusable (pre-merge test)
