<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 996 416" width="996" height="416" role="img" aria-label="The data allowlist: an event's data field passes two independent gates before any of it reaches a mailbox, first the key must be one of eleven allowlisted names, then the value must be a number, a boolean or a short single-line identifier-shaped string; an allowlisted key holding model-written text is still dropped, nested objects and arrays are never rendered, and at most six fields survive">
  <title>Two gates on every data field, because a denylist would be one new producer away from leaking</title>
  <rect x="-18" y="-18" width="996" height="416" rx="16" fill="#0A0E13"/>
  <rect x="-17.5" y="-17.5" width="995" height="415" rx="15.5" fill="none" stroke="rgba(255,255,255,.09)"/>

  <defs>
    <marker id="al-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#5A6675"/>
    </marker>
  </defs>

  <g font-family="ui-monospace,Menlo">

    <text x="480" y="24" fill="#E9EFF6" font-size="13" font-weight="700" text-anchor="middle">two gates, and the second one is the interesting one</text>
    <text x="480" y="41" fill="#5A6675" font-size="10" text-anchor="middle">mail leaves the perimeter through a server nobody here controls, so an allowlisted KEY is not enough</text>

    <!-- incoming -->
    <rect x="8" y="58" width="292" height="252" rx="11" fill="#10161F" stroke="#2a3547"/>
    <text x="154" y="79" fill="#E9EFF6" font-size="10.5" font-weight="700" text-anchor="middle">what a producer put in `data`</text>
    <text x="154" y="93" fill="#5A6675" font-size="9" text-anchor="middle">some producers sit next to prompts</text>

    <rect x="22" y="104" width="264" height="26" rx="6" fill="#141C27" stroke="#2a3547"/>
    <text x="34" y="121" fill="#C8D3E0" font-size="9.5">org: "acme"</text>

    <rect x="22" y="136" width="264" height="26" rx="6" fill="#141C27" stroke="#2a3547"/>
    <text x="34" y="153" fill="#C8D3E0" font-size="9.5">occurrences: 3</text>

    <rect x="22" y="168" width="264" height="26" rx="6" fill="#141C27" stroke="#2a3547"/>
    <text x="34" y="185" fill="#C8D3E0" font-size="9.5">tool: "read the customer's file"</text>

    <rect x="22" y="200" width="264" height="26" rx="6" fill="#141C27" stroke="#2a3547"/>
    <text x="34" y="217" fill="#C8D3E0" font-size="9.5">prompt: "You are a helpful assis"</text>

    <rect x="22" y="232" width="264" height="26" rx="6" fill="#141C27" stroke="#2a3547"/>
    <text x="34" y="249" fill="#C8D3E0" font-size="9.5">matched: "sk-live-4f2a9c01bd"</text>

    <rect x="22" y="264" width="264" height="26" rx="6" fill="#141C27" stroke="#2a3547"/>
    <text x="34" y="281" fill="#C8D3E0" font-size="9.5">detail: { ... }</text>

    <!-- gate 1 -->
    <path d="M304 182 L322 182" stroke="#5A6675" stroke-width="1.2" marker-end="url(#al-a)" fill="none"/>

    <rect x="330" y="58" width="290" height="118" rx="11" fill="#10161F" stroke="#E3B341"/>
    <text x="475" y="79" fill="#E3B341" font-size="10.5" font-weight="700" text-anchor="middle">gate 1: is the KEY allowlisted?</text>
    <text x="475" y="95" fill="#8A97A6" font-size="9" text-anchor="middle">eleven names, and adding one is a deliberate act</text>
    <text x="475" y="114" fill="#C8D3E0" font-size="9.5" text-anchor="middle">org  occurrences  budget_micros</text>
    <text x="475" y="128" fill="#C8D3E0" font-size="9.5" text-anchor="middle">spent_micros  actor  decision  tool</text>
    <text x="475" y="142" fill="#C8D3E0" font-size="9.5" text-anchor="middle">kind  count  window  upstream</text>
    <text x="475" y="163" fill="#5A6675" font-size="9" text-anchor="middle">not "is this useful" but "can it ever hold prose"</text>

    <!-- gate 2 -->
    <rect x="330" y="188" width="290" height="122" rx="11" fill="#10161F" stroke="#F0544C"/>
    <text x="475" y="209" fill="#F0544C" font-size="10.5" font-weight="700" text-anchor="middle">gate 2: is the VALUE shaped like an id?</text>
    <text x="475" y="228" fill="#C8D3E0" font-size="9.5" text-anchor="middle">^[A-Za-z0-9_:@./\- ]{1,64}$</text>
    <text x="475" y="247" fill="#8A97A6" font-size="9" text-anchor="middle">no comma, apostrophe, quote or newline, and</text>
    <text x="475" y="261" fill="#8A97A6" font-size="9" text-anchor="middle">never over 64 characters. Numbers and</text>
    <text x="475" y="274" fill="#8A97A6" font-size="9" text-anchor="middle">booleans pass as themselves; objects, arrays</text>
    <text x="475" y="287" fill="#8A97A6" font-size="9" text-anchor="middle">and null are never rendered at all</text>
    <text x="475" y="303" fill="#5A6675" font-size="9" text-anchor="middle">at most six fields survive, however many were sent</text>

    <!-- outcomes -->
    <path d="M624 130 L642 130" stroke="#5A6675" stroke-width="1.2" marker-end="url(#al-a)" fill="none"/>
    <path d="M624 240 L642 240" stroke="#5A6675" stroke-width="1.2" marker-end="url(#al-a)" fill="none"/>

    <rect x="650" y="58" width="302" height="118" rx="11" fill="#10161F" stroke="#3FB950"/>
    <text x="801" y="79" fill="#3FB950" font-size="10.5" font-weight="700" text-anchor="middle">reaches the mailbox</text>
    <rect x="664" y="92" width="274" height="26" rx="6" fill="#141C27" stroke="#2a3547"/>
    <text x="676" y="109" fill="#C8D3E0" font-size="9.5">org: "acme"</text>
    <rect x="664" y="124" width="274" height="26" rx="6" fill="#141C27" stroke="#2a3547"/>
    <text x="676" y="141" fill="#C8D3E0" font-size="9.5">occurrences: 3</text>
    <text x="801" y="166" fill="#8A97A6" font-size="9" text-anchor="middle">rendered as "Occurrences 3, org acme."</text>

    <rect x="650" y="188" width="302" height="122" rx="11" fill="#10161F" stroke="#F0544C"/>
    <text x="801" y="209" fill="#F0544C" font-size="10.5" font-weight="700" text-anchor="middle">dropped, and why</text>
    <text x="664" y="228" fill="#C8D3E0" font-size="9.5">tool</text>
    <text x="720" y="228" fill="#8A97A6" font-size="9">allowed key, the apostrophe fails gate 2</text>
    <text x="664" y="248" fill="#C8D3E0" font-size="9.5">prompt</text>
    <text x="720" y="248" fill="#8A97A6" font-size="9">not a key anyone allowed</text>
    <text x="664" y="268" fill="#C8D3E0" font-size="9.5">matched</text>
    <text x="720" y="268" fill="#8A97A6" font-size="9">id-shaped, so ONLY gate 1 stops it</text>
    <text x="664" y="288" fill="#C8D3E0" font-size="9.5">detail</text>
    <text x="720" y="288" fill="#8A97A6" font-size="9">an object, so never rendered at all</text>

    <!-- the point -->
    <rect x="8" y="326" width="944" height="68" rx="11" fill="#141C27" stroke="#5BC8F5"/>
    <text x="480" y="347" fill="#5BC8F5" font-size="11" font-weight="700" text-anchor="middle">`matched` is the row that explains the design</text>
    <text x="480" y="364" fill="#8A97A6" font-size="10" text-anchor="middle">a live secret is perfectly id-shaped, so the shape check would have passed it: only the KEY allowlist stops it</text>
    <text x="480" y="380" fill="#8A97A6" font-size="10" text-anchor="middle">which is why the list names what MAY be sent, and a denylist would be one new producer away from leaking</text>
  </g>
</svg>
