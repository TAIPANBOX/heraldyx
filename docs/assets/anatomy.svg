<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 996 436" width="996" height="436" role="img" aria-label="Anatomy of one alert: every line of the mail is colour-coded by where it came from, the event itself, the catalog of what a type means, the agent's passport for who is answerable, the in-memory fleet picture for what else is happening, and the operator's console address for the three links; nothing in the mail is text a model wrote">
  <title>Anatomy of an alert: five sources, and not one of them is free text</title>
  <rect x="-18" y="-18" width="996" height="436" rx="16" fill="#0A0E13"/>
  <rect x="-17.5" y="-17.5" width="995" height="435" rx="15.5" fill="none" stroke="rgba(255,255,255,.09)"/>

  <g font-family="ui-monospace,Menlo">

    <text x="480" y="24" fill="#E9EFF6" font-size="13" font-weight="700" text-anchor="middle">where every line of the mail comes from</text>
    <text x="480" y="41" fill="#5A6675" font-size="10" text-anchor="middle">five sources, each with a rule about what it may contribute, and none of them is text a model wrote</text>

    <!-- the mail -->
    <rect x="8" y="56" width="574" height="352" rx="11" fill="#10161F" stroke="#2a3547"/>

    <rect x="8" y="56" width="574" height="30" rx="11" fill="#141C27"/>
    <rect x="8" y="76" width="574" height="10" fill="#141C27"/>
    <text x="24" y="76" fill="#8A97A6" font-size="9.5">one message, plain text, no HTML and no images</text>

    <rect x="18" y="96" width="4" height="16" rx="2" fill="#5BC8F5"/>
    <text x="32" y="108" fill="#E9EFF6" font-size="10.5" font-weight="700">[prod-box] run-42 has exhausted its budget</text>

    <rect x="18" y="124" width="4" height="30" rx="2" fill="#5BC8F5"/>
    <text x="32" y="136" fill="#C8D3E0" font-size="9.5">Run run-42 (agent billing-agent) has exhausted its budget.</text>
    <text x="32" y="150" fill="#C8D3E0" font-size="9.5">Spent $2.00 of $2.00 (100%). Occurrences 3, org acme.</text>

    <rect x="18" y="166" width="4" height="16" rx="2" fill="#B48CFF"/>
    <text x="32" y="178" fill="#C8D3E0" font-size="9.5">What this box already did: Calls from this run are being</text>
    <text x="32" y="191" fill="#C8D3E0" font-size="9.5">refused with a hard 402.</text>

    <rect x="18" y="203" width="4" height="16" rx="2" fill="#B48CFF"/>
    <text x="32" y="215" fill="#C8D3E0" font-size="9.5">If nobody acts: The run cannot spend again until someone</text>
    <text x="32" y="228" fill="#C8D3E0" font-size="9.5">raises its budget.</text>

    <rect x="18" y="240" width="4" height="16" rx="2" fill="#34D399"/>
    <text x="32" y="252" fill="#C8D3E0" font-size="9.5">Answerable for it: team-finance@acme.example</text>

    <rect x="18" y="266" width="4" height="46" rx="2" fill="#E3B341"/>
    <text x="32" y="278" fill="#C8D3E0" font-size="9.5">Around it right now:</text>
    <text xml:space="preserve" x="32" y="291" fill="#8A97A6" font-size="9.5">  near the line   pricing-agent     82% of budget</text>
    <text xml:space="preserve" x="32" y="304" fill="#8A97A6" font-size="9.5">  behaving oddly  data-crawler      unlike its own history</text>

    <rect x="18" y="322" width="4" height="60" rx="2" fill="#9AA7B8"/>
    <text x="32" y="334" fill="#C8D3E0" font-size="9.5">Open in your console:</text>
    <text xml:space="preserve" x="32" y="347" fill="#8A97A6" font-size="9.5">  what happened   https://box/i/budget_exhausted:run-42</text>
    <text xml:space="preserve" x="32" y="360" fill="#8A97A6" font-size="9.5">  this agent      https://box/a/billing-agent</text>
    <text xml:space="preserve" x="32" y="373" fill="#8A97A6" font-size="9.5">  its owner       https://box/o/team-finance@acme.example</text>

    <text x="32" y="397" fill="#5A6675" font-size="9">Raised by tokenfuse. Identifiers and numbers only, never call content.</text>

    <!-- the legend -->
    <rect x="600" y="56" width="352" height="60" rx="10" fill="#141C27" stroke="#2a3547"/>
    <rect x="600" y="56" width="5" height="60" rx="2.5" fill="#5BC8F5"/>
    <text x="618" y="76" fill="#5BC8F5" font-size="10.5" font-weight="700">the event itself</text>
    <text x="618" y="91" fill="#8A97A6" font-size="9.5">type, run, agent, and the numbers that</text>
    <text x="618" y="104" fill="#8A97A6" font-size="9.5">survived the data allowlist</text>

    <rect x="600" y="126" width="352" height="72" rx="10" fill="#141C27" stroke="#2a3547"/>
    <rect x="600" y="126" width="5" height="72" rx="2.5" fill="#B48CFF"/>
    <text x="618" y="146" fill="#B48CFF" font-size="10.5" font-weight="700">the catalog, in internal/render</text>
    <text x="618" y="161" fill="#8A97A6" font-size="9.5">what a type MEANS: what the box already</text>
    <text x="618" y="174" fill="#8A97A6" font-size="9.5">did, and what happens if nobody acts.</text>
    <text x="618" y="188" fill="#8A97A6" font-size="9.5">18 types known; the rest say so plainly</text>

    <rect x="600" y="208" width="352" height="60" rx="10" fill="#141C27" stroke="#2a3547"/>
    <rect x="600" y="208" width="5" height="60" rx="2.5" fill="#34D399"/>
    <text x="618" y="228" fill="#34D399" font-size="10.5" font-weight="700">the agent's passport</text>
    <text x="618" y="243" fill="#8A97A6" font-size="9.5">the owner, never the on_behalf_of. No</text>
    <text x="618" y="256" fill="#8A97A6" font-size="9.5">passport means no owner line, not a guess</text>

    <rect x="600" y="278" width="352" height="60" rx="10" fill="#141C27" stroke="#2a3547"/>
    <rect x="600" y="278" width="5" height="60" rx="2.5" fill="#E3B341"/>
    <text x="618" y="298" fill="#E3B341" font-size="10.5" font-weight="700">what else it has seen</text>
    <text x="618" y="313" fill="#8A97A6" font-size="9.5">in memory only, since this process</text>
    <text x="618" y="326" fill="#8A97A6" font-size="9.5">started. Built from types and numbers</text>

    <rect x="600" y="348" width="352" height="60" rx="10" fill="#141C27" stroke="#2a3547"/>
    <rect x="600" y="348" width="5" height="60" rx="2.5" fill="#9AA7B8"/>
    <text x="618" y="368" fill="#9AA7B8" font-size="10.5" font-weight="700">your console address</text>
    <text x="618" y="383" fill="#8A97A6" font-size="9.5">three coordinates, no token and no query</text>
    <text x="618" y="396" fill="#8A97A6" font-size="9.5">string. Unset means the mail has no link</text>
  </g>
</svg>
