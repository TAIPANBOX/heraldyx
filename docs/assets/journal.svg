<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 996 426" width="996" height="426" role="img" aria-label="The dispatch journal: every message sent appends one hash-chained agent-event on heraldyx's own volume, never into the planes' read-only event log; editing any record breaks the chain from that point on and heraldyx --journal exits non-zero; the record says accepted rather than delivered, and a chain of one record is not reported as verified because it binds nothing">
  <title>The dispatch journal: what it wrote to you, sealed, on its own volume</title>
  <rect x="-18" y="-18" width="996" height="426" rx="16" fill="#0A0E13"/>
  <rect x="-17.5" y="-17.5" width="995" height="425" rx="15.5" fill="none" stroke="rgba(255,255,255,.09)"/>

  <defs>
    <marker id="jr-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#5A6675"/>
    </marker>
    <marker id="jr-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#F0544C"/>
    </marker>
  </defs>

  <g font-family="ui-monospace,Menlo">

    <text x="480" y="24" fill="#E9EFF6" font-size="13" font-weight="700" text-anchor="middle">one message sent, one sealed record, on a volume the planes cannot reach</text>
    <text x="480" y="41" fill="#5A6675" font-size="10" text-anchor="middle">"we wrote to you at 03:14" is a claim somebody eventually has to prove, in an argument they did not choose</text>

    <!-- the chain -->
    <rect x="8" y="58" width="222" height="96" rx="10" fill="#141C27" stroke="#2a3547"/>
    <text x="22" y="78" fill="#5BC8F5" font-size="10" font-weight="700">alert_sent</text>
    <text x="22" y="94" fill="#8A97A6" font-size="9">about  budget_exhausted:run-42</text>
    <text x="22" y="107" fill="#8A97A6" font-size="9">to     ops@acme.example</text>
    <text x="22" y="120" fill="#8A97A6" font-size="9">via    smtp</text>
    <text x="22" y="133" fill="#3FB950" font-size="9">outcome  accepted</text>
    <text x="22" y="147" fill="#5A6675" font-size="8.5">prev_hash  (head)</text>

    <path d="M234 106 L244 106" stroke="#5A6675" stroke-width="1.2" marker-end="url(#jr-a)" fill="none"/>

    <rect x="248" y="58" width="222" height="96" rx="10" fill="#141C27" stroke="#2a3547"/>
    <text x="262" y="78" fill="#5BC8F5" font-size="10" font-weight="700">alert_sent</text>
    <text x="262" y="94" fill="#8A97A6" font-size="9">about  policy_deny:run-77</text>
    <text x="262" y="107" fill="#8A97A6" font-size="9">to     ops@acme.example</text>
    <text x="262" y="120" fill="#8A97A6" font-size="9">via    smtp</text>
    <text x="262" y="133" fill="#3FB950" font-size="9">outcome  accepted</text>
    <text x="262" y="147" fill="#5A6675" font-size="8.5">prev_hash  a3f2...c10b</text>

    <path d="M474 106 L484 106" stroke="#F0544C" stroke-width="1.2" marker-end="url(#jr-red)" fill="none"/>

    <rect x="488" y="58" width="222" height="96" rx="10" fill="#141C27" stroke="#F0544C" stroke-width="1.3"/>
    <text x="502" y="78" fill="#F0544C" font-size="10" font-weight="700">alert_sent (edited)</text>
    <text x="502" y="94" fill="#8A97A6" font-size="9">about  policy_deny:run-78</text>
    <text x="502" y="107" fill="#F0544C" font-size="9">to     nobody@example</text>
    <text x="502" y="120" fill="#8A97A6" font-size="9">via    smtp</text>
    <text x="502" y="133" fill="#8A97A6" font-size="9">outcome  accepted</text>
    <text x="502" y="147" fill="#5A6675" font-size="8.5">prev_hash  9d41...77ae</text>

    <path d="M714 106 L724 106" stroke="#F0544C" stroke-width="1.2" marker-end="url(#jr-red)" fill="none"/>

    <rect x="728" y="58" width="222" height="96" rx="10" fill="#141C27" stroke="#2a3547"/>
    <text x="742" y="78" fill="#5BC8F5" font-size="10" font-weight="700">alert_sent</text>
    <text x="742" y="94" fill="#8A97A6" font-size="9">about  run_killed:run-91</text>
    <text x="742" y="107" fill="#8A97A6" font-size="9">to     ops@acme.example</text>
    <text x="742" y="120" fill="#8A97A6" font-size="9">via    smtp</text>
    <text x="742" y="133" fill="#3FB950" font-size="9">outcome  accepted</text>
    <text x="742" y="147" fill="#F0544C" font-size="8.5">prev_hash  does not match</text>

    <text x="599" y="176" fill="#F0544C" font-size="9.5" text-anchor="middle">one edited record breaks every link after it, and the break names where</text>

    <!-- the reader -->
    <rect x="8" y="192" width="470" height="118" rx="11" fill="#10161F" stroke="#2a3547"/>
    <text x="24" y="212" fill="#E9EFF6" font-size="10.5" font-weight="700">heraldyx --journal</text>
    <text x="24" y="228" fill="#5A6675" font-size="9">the image is distroless: there is no shell in it to read the file with</text>

    <rect x="24" y="238" width="438" height="60" rx="7" fill="#0C1119" stroke="#2a3547"/>
    <text x="36" y="254" fill="#8A97A6" font-size="9">records: 4 (alert 4)</text>
    <text x="36" y="267" fill="#8A97A6" font-size="9">outcome: 4 accepted, 0 refused</text>
    <text xml:space="preserve" x="36" y="280" fill="#F0544C" font-size="9">chain:   BROKEN, 1 mismatch(es) (2 chained, 1 head(s))</text>
    <text x="36" y="293" fill="#5A6675" font-size="9">exit 1, so a deployment check can use it directly</text>

    <!-- what it never does -->
    <rect x="494" y="192" width="456" height="118" rx="11" fill="#10161F" stroke="#2a3547"/>
    <text x="510" y="212" fill="#E9EFF6" font-size="10.5" font-weight="700">it reports, and never repairs</text>
    <text x="510" y="231" fill="#8A97A6" font-size="9.5">A tool that could mend the chain would be a tool that</text>
    <text x="510" y="245" fill="#8A97A6" font-size="9.5">could forge it, and the whole value of the file is that</text>
    <text x="510" y="259" fill="#8A97A6" font-size="9.5">nobody can.</text>
    <text x="510" y="280" fill="#5BC8F5" font-size="9.5" font-weight="700">Written to heraldyx's own volume, never into the</text>
    <text x="510" y="294" fill="#5BC8F5" font-size="9.5" font-weight="700">planes' log, which is mounted read-only.</text>

    <!-- three honesty cards -->
    <rect x="8" y="326" width="308" height="72" rx="10" fill="#141C27" stroke="#2a3547"/>
    <text x="24" y="346" fill="#E3B341" font-size="10" font-weight="700">"accepted", never "delivered"</text>
    <text x="24" y="363" fill="#8A97A6" font-size="9">What this process observes is a mail server</text>
    <text x="24" y="376" fill="#8A97A6" font-size="9">taking the message. A mailbox, a spam folder</text>
    <text x="24" y="389" fill="#8A97A6" font-size="9">or a silent filter are not knowable from here.</text>

    <rect x="326" y="326" width="308" height="72" rx="10" fill="#141C27" stroke="#2a3547"/>
    <text x="342" y="346" fill="#E3B341" font-size="10" font-weight="700">a chain of one is not "verified"</text>
    <text x="342" y="363" fill="#8A97A6" font-size="9">The first record has no predecessor to hash,</text>
    <text x="342" y="376" fill="#8A97A6" font-size="9">so editing it is undetectable. A check that</text>
    <text x="342" y="389" fill="#8A97A6" font-size="9">cannot fail is worse than none, being louder.</text>

    <rect x="644" y="326" width="306" height="72" rx="10" fill="#141C27" stroke="#2a3547"/>
    <text x="660" y="346" fill="#E3B341" font-size="10" font-weight="700">this file DOES name recipients</text>
    <text x="660" y="363" fill="#8A97A6" font-size="9">Unlike the mail, it never leaves your box.</text>
    <text x="660" y="376" fill="#8A97A6" font-size="9">An operator proving they were told needs the</text>
    <text x="660" y="389" fill="#8A97A6" font-size="9">address; "one recipient, hash a3f2" proves nothing.</text>
  </g>
</svg>
