<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#4493f8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#161d27" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
</defs><rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/><rect x="0" y="0" width="1280" height="720" fill="url(#grid)" opacity="0.5"/><rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>
<text x="1252" y="698" font-size="12.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="end">github.com/TAIPANBOX/heraldyx</text>
<text x="40" y="56" font-size="34" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700">heraldyx</text>
<text x="216" y="56" font-size="22" fill="#9aa7b8" font-weight="600">- one mail, and never a button</text>
<text x="40" y="84" font-size="15" fill="#9aa7b8">It reads the log the box already writes, and decides what a person hears about tonight.</text>
<line x1="40" y1="100" x2="1240" y2="100" stroke="#222b38" stroke-width="1"/><text x="42" y="138" font-size="12" fill="#9aa7b8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">01 &#183; WHAT IT READS</text><rect x="40" y="150" width="300" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><rect x="56" y="176" width="268" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="176" width="4" height="62" rx="2" ry="2" fill="#9aa7b8" stroke="#283341" stroke-width="1"/><text x="74" y="200" font-size="14.5" fill="#e6edf3" font-weight="600">the shared NDJSON log</text><text x="74" y="218" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">read-only, re-read every poll</text><text x="74" y="235" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">no producer is registered</text><text x="60" y="288" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">A plane deployed later is picked</text><text x="60" y="307" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">up with no configuration here,</text><text x="60" y="326" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">because the bus is a directory</text><text x="60" y="345" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">and not a broker.</text><text x="60" y="400" font-size="13" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">It never writes to that log,</text><text x="60" y="421" font-size="13" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">and never calls another plane.</text><text x="60" y="470" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Which is why the newest sources</text><text x="60" y="489" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">needed no code here at all:</text><rect x="58" y="508" width="263" height="22" rx="11" fill="#1a212c" stroke="#4493f8" stroke-width="1.4"/><text x="189.5" y="523" font-size="11" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">vouchryx: delegation events</text><rect x="58" y="544" width="236" height="22" rx="11" fill="#1a212c" stroke="#3fb950" stroke-width="1.4"/><text x="176.0" y="559" font-size="11" fill="#3fb950" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">costcrew: spend and crew</text><text x="378" y="138" font-size="12" fill="#e3b341" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">02 &#183; THREE FILTERS</text><rect x="376" y="150" width="300" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><rect x="392" y="176" width="268" height="70" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="392" y="176" width="4" height="70" rx="2" ry="2" fill="#e3b341" stroke="#283341" stroke-width="1"/><text x="410" y="200" font-size="14.5" fill="#e6edf3" font-weight="600">a severity floor</text><text x="410" y="218" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">info never wakes anybody, and</text><text x="410" y="235" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">the floor is configuration</text><rect x="392" y="262" width="268" height="70" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="392" y="262" width="4" height="70" rx="2" ry="2" fill="#e3b341" stroke="#283341" stroke-width="1"/><text x="410" y="286" font-size="14.5" fill="#e6edf3" font-weight="600">a dedup window</text><text x="410" y="304" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">the same thing twice is one</text><text x="410" y="321" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">mail, not two</text><rect x="392" y="348" width="268" height="70" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="392" y="348" width="4" height="70" rx="2" ry="2" fill="#e3b341" stroke="#283341" stroke-width="1"/><text x="410" y="372" font-size="14.5" fill="#e6edf3" font-weight="600">an hourly ceiling</text><text x="410" y="390" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">a storm cannot turn into a</text><text x="410" y="407" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">thousand mails</text><text x="396" y="460" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Each is a number an operator sets,</text><text x="396" y="479" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">not a heuristic that learns. What</text><text x="396" y="498" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">reaches you tonight is a decision</text><text x="396" y="517" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">somebody wrote down.</text><rect x="394" y="546" width="101" height="22" rx="11" fill="#1a212c" stroke="#3fb950" stroke-width="1.4"/><text x="444.5" y="561" font-size="11" fill="#3fb950" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">159 tests</text><rect x="394" y="582" width="281" height="22" rx="11" fill="#1a212c" stroke="#4493f8" stroke-width="1.4"/><text x="534.5" y="597" font-size="11" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">one egress hole, default-deny</text><text x="714" y="138" font-size="12" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">03 &#183; WHAT LEAVES</text><rect x="712" y="150" width="264" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><rect x="740.0" y="179.0" width="208" height="62" rx="31.0" fill="none" stroke="#4493f8" stroke-width="1.1" opacity="0.3"/><rect x="744.0" y="183.0" width="200" height="54" rx="27.0" fill="#1a212c" stroke="#4493f8" stroke-width="2"/><text x="844" y="209" font-size="13" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">one mail</text><text x="844" y="225" font-size="9.5" fill="#4493f8" font-weight="700" text-anchor="middle" letter-spacing="0.5">OVER SMTP</text><text x="844" y="280" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="middle">It carries a link into your</text><text x="844" y="299" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="middle">own console, and nothing</text><text x="844" y="318" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="middle">that acts.</text><rect x="728" y="344" width="232" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="728" y="344" width="4" height="62" rx="2" ry="2" fill="#ff6b63" stroke="#283341" stroke-width="1"/><text x="746" y="368" font-size="14.5" fill="#e6edf3" font-weight="600">no button</text><text x="746" y="386" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">a mail that can kill a run is</text><text x="746" y="403" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">a mail somebody can forge</text><rect x="728" y="422" width="232" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="728" y="422" width="4" height="62" rx="2" ry="2" fill="#ff6b63" stroke="#283341" stroke-width="1"/><text x="746" y="446" font-size="14.5" fill="#e6edf3" font-weight="600">a view, never an action</text><text x="746" y="464" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">the deep link opens the</text><text x="746" y="481" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">console; you decide there</text><text x="716" y="540" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">The stack's way OUT is this,</text><text x="716" y="559" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">and its way IN is genaryx.</text><text x="716" y="578" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">One reads and mails, the</text><text x="716" y="597" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">other signs and acts.</text><text x="1014" y="138" font-size="12" fill="#3fb950" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">04 &#183; WHAT IT KEEPS</text><rect x="1012" y="150" width="228" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><rect x="1028" y="176" width="196" height="78" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="1028" y="176" width="4" height="78" rx="2" ry="2" fill="#3fb950" stroke="#283341" stroke-width="1"/><text x="1046" y="200" font-size="14.5" fill="#e6edf3" font-weight="600">a dispatch record</text><text x="1046" y="218" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">hash-chained, on its</text><text x="1046" y="235" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">own volume</text><text x="1032" y="296" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">So the question</text><text x="1032" y="315" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">asked after an</text><text x="1032" y="334" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">incident, did</text><text x="1032" y="353" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">anybody get told,</text><text x="1032" y="372" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">has an answer in</text><text x="1032" y="391" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">the record rather</text><text x="1032" y="410" font-size="12.5" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">than in memory.</text><line x1="1028" y1="450" x2="1224" y2="450" stroke="#222b38" stroke-width="1" opacity="0.9"/><text x="1032" y="480" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">It also says when</text><text x="1032" y="498" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">it sent nothing,</text><text x="1032" y="516" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">which is the half</text><text x="1032" y="534" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">a mail log cannot</text><text x="1032" y="552" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">give you.</text><path d="M 350 401 L 359 410 L 350 419" fill="none" stroke="#e3b341" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 686 401 L 695 410 L 686 419" fill="none" stroke="#e3b341" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 986 401 L 995 410 L 986 419" fill="none" stroke="#e3b341" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>